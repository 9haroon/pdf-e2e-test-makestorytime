name: Vercel Preview Deployment

# Trigger the workflow on pull requests targeting the main branch
on:
  pull_request:
    branches:
      - main

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify a Node.js version compatible with your project

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Build and Deploy Preview
        env:
          # Vercel CLI requires these environment variables for authentication and project identification
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # The 'vercel --yes' command automatically deploys the project to Vercel.
          # For pull requests, it creates a preview deployment and comments the URL on the PR.
          # The --yes flag bypasses interactive prompts.
          vercel --yes